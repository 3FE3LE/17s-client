name: Mobile Export

on:
  workflow_dispatch:
    inputs:
      package:
        description: Mobile package to export
        required: true
        type: choice
        options:
          - '@17suit/one-pt-mobile'
          - '@17suit/two-sb-mobile'
          - '@17suit/four-yc-mobile'
          - '@17suit/fourteen-cp-mobile'
          - '@17suit/five-bg-mobile'
          - '@17suit/six-sp-mobile'
          - '@17suit/seven-rc-mobile'
          - '@17suit/eight-dd-mobile'
          - '@17suit/nine-nr-mobile'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="${{ inputs.package }}"
