name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_SCM_BASE: origin/main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No build here: Vercel builds on deploy, so building again in CI is
      # redundant. CI only gates code quality (lint + types) on affected
      # packages.
      - name: Lint and typecheck affected packages
        run: pnpm exec turbo run lint typecheck --affected
