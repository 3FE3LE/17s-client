name: CI

# Triggers:
# - pull_request: required status check for branch protection on any base
#   branch. Runs the quality job (lint + typecheck + test + verify +
#   registry). NO build on PRs — per user policy, builds are deferred to
#   the promotion workflow (push to preview or production).
# - push to preview/production: runs the same quality job PLUS the build
#   job, since merging into a promotion branch should compile end-to-end
#   before Vercel picks up the deployment. Pushes to feat/* or other
#   short-lived branches do not run the build (they don't get Vercel
#   deploys anyway).
# - workflow_dispatch: manual re-run for debugging.
on:
  pull_request:
  push:
    branches: [preview, production]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_SCM_BASE: origin/main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck affected packages
        run: pnpm exec turbo run lint typecheck --affected
      - name: Test affected packages
        run: pnpm exec turbo run test --affected
      # API contract drift gate. Fetches the latest openapi.json artifact
      # from 17Suit/17s-server main and diffs the regenerated
      # packages/core/src/api-schema.ts against the committed version. Fails
      # on drift; no-ops cleanly when the artifact can't be fetched (so
      # missing server CI never blocks a client PR).
      - name: Verify API schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm verify:api-schema
      # App registry drift gate. Asserts every apps/<slug>/ and
      # packages/modules/<slug>/ referenced in apps-registry.json exists on
      # disk and vice versa. Passes cleanly when the registry is not
      # reachable (CI on 17s-client alone).
      - name: Verify apps registry
        run: node tooling/scripts/check-registry.mjs

  build:
    # Build runs ONLY on PRs that target development — the first
    # promotion step in the 3-tier flow (feat/* → development → preview →
    # production). PRs against preview or production, plus push events
    # on those branches, skip the build; their compile-validation is
    # already proven by the PR that landed them in development. This
    # matches the release.sh promotion model where the actual compile
    # happens once, at the development PR boundary.
    if: github.event_name == 'pull_request' && github.base_ref == 'development'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build gate. Runs the full turbo build pipeline on affected
      # packages so the development branch is guaranteed to compile
      # end-to-end before promotion. Subsequent promotions to preview
      # and production don't re-run this; they fast-forward from
      # development where the build was already proven.
      - name: Build affected packages
        run: pnpm exec turbo run build --affected
