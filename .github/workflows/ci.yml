name: CI

# Triggers:
# - pull_request: required status check for branch protection on any base
#   branch. Runs the quality job (lint + typecheck + test + verify +
#   registry). NO build on PRs — per user policy, builds are deferred to
#   the promotion workflow (push to preview or production).
# - push to development: runs the quality job (integration branch).
# - push to preview/production: runs the same quality job PLUS the build
#   job, since merging into a promotion branch should compile end-to-end
#   before Vercel picks up the deployment. Pushes to feat/* or other
#   short-lived branches do not run the build (they don't get Vercel
#   deploys anyway).
# - workflow_dispatch: manual re-run for debugging.
on:
  pull_request:
  push:
    branches: [development, preview, production]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # TURBO_SCM_BASE (the `--affected` comparison point) is resolved per event
  # in the "Resolve affected base" step: the PR base branch, or the previous
  # tip on push. A fixed origin/main was stale after the move to
  # development/preview/production and over- or under-selected packages.

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve affected base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="origin/development"
          fi
          echo "TURBO_SCM_BASE=$base" >> "$GITHUB_ENV"
          echo "Affected base: $base"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck affected packages
        run: pnpm exec turbo run lint typecheck --affected
      # PRs: Vitest follows the import graph and runs only specs related to the
      # diff (docs/e2e-selection.md). Pushes run the whole affected packages.
      - name: Test affected packages (changed specs only)
        if: github.event_name == 'pull_request'
        run: pnpm exec turbo run test --affected -- --changed "$TURBO_SCM_BASE" --passWithNoTests
      - name: Test affected packages
        if: github.event_name != 'pull_request'
        run: pnpm exec turbo run test --affected
      # Coverage floor on domain and services only (lib + server actions). Fast, so it runs
      # unconditionally; thresholds live in each app's vitest.config.ts.
      - name: Coverage gate (seven-rc-web)
        run: pnpm --filter @17suit/seven-rc-web test:coverage
      # API contract drift gate. Fetches the latest openapi.json artifact
      # from 17Suit/17s-server main and diffs the regenerated
      # packages/core/src/api-schema.ts against the committed version. Fails
      # on drift; no-ops cleanly when the artifact can't be fetched (so
      # missing server CI never blocks a client PR).
      - name: Verify API schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm verify:api-schema
      # Design-token drift gate. CSS token files in packages/tailwind-config
      # are generated from packages/design-system/src/tokens.ts; fails when a
      # committed CSS file no longer matches the canonical TS theme.
      - name: Verify design tokens
        run: pnpm tokens:check
      # App registry drift gate. Asserts every apps/<slug>/ and
      # packages/modules/<slug>/ referenced in apps-registry.json exists on
      # disk and vice versa. Passes cleanly when the registry is not
      # reachable (CI on 17s-client alone).
      - name: Verify apps registry
        run: node tooling/scripts/check-registry.mjs

  build:
    # Only runs on push to preview/production (PRs skip the build per the
    # promotion policy above). Pushed into a separate job so it doesn't
    # burn minutes on every PR.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve affected base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="origin/development"
          fi
          echo "TURBO_SCM_BASE=$base" >> "$GITHUB_ENV"
          echo "Affected base: $base"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build gate. Runs the full turbo build pipeline on affected
      # packages so the promotion branch is guaranteed to compile
      # end-to-end before Vercel picks up the deployment. Vercel no
      # longer auto-builds on push; this job is the build signal.
      - name: Build affected packages
        run: pnpm exec turbo run build --affected
