name: CI

# Triggers:
# - pull_request: required status check for branch protection on main.
# - push to main: runs after a merge so the merge commit carries its own
#   CI status. Without this, Vercel's "Wait for CI" gate and any strict
#   branch-protection rule block because the workflow never fires on
#   the merge event.
# - workflow_dispatch: manual re-run for debugging.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_SCM_BASE: origin/main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No build here: Vercel builds on deploy, so building again in CI is
      # redundant. CI only gates code quality (lint + types) on affected
      # packages.
      - name: Lint and typecheck affected packages
        run: pnpm exec turbo run lint typecheck --affected
      # Test gate runs landing for now (the only workspace wired for vitest).
      # Extend the `test` turbo task to additional apps as they adopt tests.
      - name: Test affected packages
        run: pnpm exec turbo run test --affected
      # API contract drift gate. Fetches the latest openapi.json artifact
      # from 17Suit/17s-server main and diffs the regenerated
      # packages/core/src/api-schema.ts against the committed version. Fails
      # on drift; no-ops cleanly when the artifact can't be fetched (so
      # missing server CI never blocks a client PR).
      - name: Verify API schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm verify:api-schema
